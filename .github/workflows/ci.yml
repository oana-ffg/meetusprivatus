name: CI

on:
  pull_request:
  push:
    branches: [main, perf/no-worker-pipe-wait]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Behavioral tests use synthetic capture/recognition. Native checks need real devices.
      MEETUS_NATIVE_TESTS: '0'
      MEETUS_BASELINE_TESTS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and run behavioral tests
        shell: pwsh
        run: ./scripts/build.ps1
